<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subtraction Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f4efff;
  font-family: Arial, sans-serif;
}

.game {
  width: 90%;
  max-width: 700px;
  background: white;
  border-radius: 30px;
  padding: 40px 35px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

h1 {
  margin: 0 0 25px;
  font-size: 38px;
  color: #222;
}

.info {
  display: flex;
  justify-content: space-between;
  font-size: 21px;
  margin-bottom: 25px;
  color: #333;
}

#question {
  font-size: 80px;
  font-weight: bold;
  margin: 30px 0 45px;
  color: #111;
}

.answers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.answer {
  border: none;
  border-radius: 20px;
  padding: 25px 10px;
  font-size: 36px;
  font-weight: bold;
  background: #eeeeee;
  cursor: pointer;
  transition: transform 0.15s;
}

.answer:hover {
  transform: scale(1.05);
}

.answer:disabled {
  cursor: default;
}

#feedback {
  height: 40px;
  margin-top: 25px;
  font-size: 30px;
  font-weight: bold;
}

#next,
#restart,
#start {
  border: none;
  border-radius: 15px;
  padding: 15px 35px;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}

#start {
  margin-top: 10px;
}

#next {
  display: none;
}

#restart {
  display: none;
}

#result {
  font-size: 32px;
  font-weight: bold;
  margin: 30px 0;
}

.hidden {
  display: none !important;
}

.start-text {
  font-size: 24px;
  margin-bottom: 20px;
}

/* Tablet / HP */
@media (max-width: 600px) {

  .game {
    width: 94%;
    padding: 30px 20px;
  }

  h1 {
    font-size: 30px;
  }

  .info {
    font-size: 17px;
  }

  #question {
    font-size: 60px;
    margin: 25px 0 35px;
  }

  .answers {
    gap: 10px;
  }

  .answer {
    padding: 20px 5px;
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div class="game">

  <h1>SUBTRACTION</h1>

  <!-- START SCREEN -->
  <div id="startScreen">

    <p class="start-text">
      20 Questions
    </p>

    <button id="start" onclick="startGame()">
      START
    </button>

  </div>


  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">

    <div class="info">

      <span>
        Question
        <span id="number">1</span>/20
      </span>

      <span>
        Score:
        <span id="score">0</span>
      </span>

    </div>


    <div id="question">
      8 − 3 = ?
    </div>


    <div class="answers">

      <button class="answer" onclick="checkAnswer(0)"></button>

      <button class="answer" onclick="checkAnswer(1)"></button>

      <button class="answer" onclick="checkAnswer(2)"></button>

    </div>


    <div id="feedback"></div>

    <button id="next" onclick="nextQuestion()">
      NEXT
    </button>

  </div>


  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="hidden">

    <div id="result"></div>

    <button id="restart" onclick="restartGame()">
      PLAY AGAIN
    </button>

  </div>

</div>


<script>

let currentQuestion = 0;
let score = 0;
let correctAnswer = 0;
let choices = [];


function startGame() {

  currentQuestion = 0;
  score = 0;

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  document
    .getElementById("score")
    .textContent = score;

  showQuestion();
}


function showQuestion() {

  document
    .getElementById("number")
    .textContent = currentQuestion + 1;

  document
    .getElementById("feedback")
    .textContent = "";

  document
    .getElementById("next")
    .style.display = "none";


  const buttons =
    document.querySelectorAll(".answer");


  buttons.forEach(function(btn) {

    btn.disabled = false;

    btn.style.background = "#eeeeee";

  });


  /*
    SUBTRACTION WITHIN 10
    Answer will never be negative
  */

  const minuend =
    Math.floor(Math.random() * 11);

  const subtrahend =
    Math.floor(
      Math.random() * (minuend + 1)
    );

  correctAnswer =
    minuend - subtrahend;


  document
    .getElementById("question")
    .textContent =
      `${minuend} − ${subtrahend} = ?`;


  choices = [correctAnswer];


  /*
    Create 2 wrong answers
  */

  while (choices.length < 3) {

    let wrong =
      Math.floor(Math.random() * 11);

    if (!choices.includes(wrong)) {

      choices.push(wrong);

    }

  }


  /*
    Randomize answer positions
  */

  choices.sort(function() {

    return Math.random() - 0.5;

  });


  buttons.forEach(function(btn, i) {

    btn.textContent = choices[i];

  });

}


function checkAnswer(index) {

  const buttons =
    document.querySelectorAll(".answer");

  const selected =
    choices[index];


  /*
    Prevent multiple clicks
  */

  buttons.forEach(function(btn) {

    btn.disabled = true;

  });


  /*
    CORRECT ANSWER
  */

  if (selected === correctAnswer) {

    score++;

    document
      .getElementById("score")
      .textContent = score;

    document
      .getElementById("feedback")
      .textContent = "✓ Correct!";

    buttons[index]
      .style.background = "#b8e6b8";

  }


  /*
    WRONG ANSWER
  */

  else {

    document
      .getElementById("feedback")
      .textContent = "✗ Try again!";

    buttons[index]
      .style.background = "#f3b5b5";


    /*
      Show the correct answer
    */

    buttons.forEach(function(btn, i) {

      if (choices[i] === correctAnswer) {

        btn.style.background = "#b8e6b8";

      }

    });

  }


  /*
    Show NEXT button
  */

  document
    .getElementById("next")
    .style.display = "inline-block";

}


function nextQuestion() {

  currentQuestion++;


  if (currentQuestion >= 20) {

    showResult();

  }

  else {

    showQuestion();

  }

}


function showResult() {

  document
    .getElementById("gameScreen")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .textContent =
      `Your Score: ${score} / 20`;


  document
    .getElementById("restart")
    .style.display = "inline-block";

}


function restartGame() {

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  startGame();

}

</script>

</body>
</html>
