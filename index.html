<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subtraction Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(
    135deg,
    #ffd6e7,
    #d9f3ff,
    #fff2b8,
    #dff7df
  );

  font-family: Arial, sans-serif;
}

.game {
  width: 90%;
  max-width: 700px;
  background: white;
  border-radius: 30px;
  padding: 40px 35px;
  text-align: center;

  box-shadow: 0 12px 35px rgba(0,0,0,0.15);
}

/* TITLE */

h1 {
  margin: 0 0 25px;
  font-size: 38px;
  color: #ff6b8a;
  text-shadow: 2px 2px 0 #ffd6e7;
}

/* INFO */

.info {
  display: flex;
  justify-content: space-between;
  font-size: 21px;
  margin-bottom: 25px;
  color: #555;
}

.info > span {
  background: #fff3b0;
  padding: 8px 15px;
  border-radius: 15px;
  font-weight: bold;
}

/* QUESTION BOX */

#question {
  font-size: 75px;
  font-weight: bold;

  margin: 25px 0 40px;

  background: linear-gradient(
    135deg,
    #b8e8ff,
    #d9c8ff
  );

  color: #4b3f72;

  border-radius: 25px;

  padding: 30px 15px;

  border: 5px solid white;

  box-shadow:
    0 6px 0 #b8a9df,
    0 10px 20px rgba(0,0,0,0.12);
}

/* ANSWERS */

.answers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.answer {
  border: none;
  border-radius: 20px;

  padding: 25px 10px;

  font-size: 36px;
  font-weight: bold;

  color: white;

  cursor: pointer;

  transition: 0.15s;

  box-shadow: 0 6px 0 rgba(0,0,0,0.15);
}

.answer:nth-child(1) {
  background: #ff8fab;
}

.answer:nth-child(2) {
  background: #6ecbff;
}

.answer:nth-child(3) {
  background: #7ed957;
}

.answer:hover {
  transform: translateY(-4px) scale(1.03);
}

.answer:active {
  transform: translateY(3px);
}

.answer:disabled {
  cursor: default;
}

/* FEEDBACK */

#feedback {
  height: 40px;
  margin-top: 25px;

  font-size: 28px;
  font-weight: bold;

  color: #555;
}

/* BUTTONS */

#next,
#restart,
#start {
  border: none;
  border-radius: 18px;

  padding: 15px 35px;

  font-size: 21px;
  font-weight: bold;

  cursor: pointer;

  margin-top: 20px;

  color: white;

  box-shadow: 0 5px 0 rgba(0,0,0,0.15);

  transition: 0.15s;
}

#start {
  background: #ff9f43;
  margin-top: 10px;
}

#next {
  background: #6c63ff;
  display: none;
}

#restart {
  background: #ff6b8a;
  display: none;
}

#start:hover,
#next:hover,
#restart:hover {
  transform: translateY(-3px);
}

#start:active,
#next:active,
#restart:active {
  transform: translateY(2px);
}

/* RESULT */

#result {
  font-size: 32px;
  font-weight: bold;

  margin: 30px 0;

  color: #6c63ff;

  background: #fff3b0;

  border-radius: 20px;

  padding: 20px;
}

/* START TEXT */

.start-text {
  font-size: 24px;
  margin-bottom: 20px;
  color: #666;
}

/* HIDDEN */

.hidden {
  display: none !important;
}


/* MOBILE */

@media (max-width: 600px) {

  .game {
    width: 94%;
    padding: 30px 20px;
  }

  h1 {
    font-size: 30px;
  }

  .info {
    font-size: 15px;
  }

  .info > span {
    padding: 6px 10px;
  }

  #question {
    font-size: 55px;
    margin: 25px 0 35px;
    padding: 25px 10px;
  }

  .answers {
    gap: 10px;
  }

  .answer {
    padding: 20px 5px;
    font-size: 28px;
  }
}
</style>
</head>


<body>

<div class="game">

  <h1>🌈 SUBTRACTION 🌈</h1>


  <!-- START SCREEN -->

  <div id="startScreen">

    <p class="start-text">
      ⭐ 20 Questions ⭐
    </p>

    <button id="start" onclick="startGame()">
      🚀 START
    </button>

  </div>


  <!-- GAME SCREEN -->

  <div id="gameScreen" class="hidden">

    <div class="info">

      <span>
        📝 Question
        <span id="number">1</span>/20
      </span>

      <span>
        ⭐ Score:
        <span id="score">0</span>
      </span>

    </div>


    <!-- QUESTION -->

    <div id="question">
      10 − 3 = ?
    </div>


    <!-- ANSWERS -->

    <div class="answers">

      <button
        class="answer"
        onclick="checkAnswer(0)">
      </button>

      <button
        class="answer"
        onclick="checkAnswer(1)">
      </button>

      <button
        class="answer"
        onclick="checkAnswer(2)">
      </button>

    </div>


    <div id="feedback"></div>


    <button
      id="next"
      onclick="nextQuestion()">
      NEXT ➜
    </button>

  </div>


  <!-- RESULT SCREEN -->

  <div id="resultScreen" class="hidden">

    <div id="result"></div>

    <button
      id="restart"
      onclick="restartGame()">
      🔄 PLAY AGAIN
    </button>

  </div>

</div>


<script>

let currentQuestion = 0;

let score = 0;

let correctAnswer = 0;

let choices = [];


/* =========================
   20 FIXED QUESTIONS
========================= */

const questions = [

  [10, 3],
  [8, 5],
  [2, 1],
  [9, 4],
  [6, 4],
  [7, 2],
  [5, 3],
  [10, 6],
  [4, 1],
  [9, 7],
  [8, 3],
  [6, 2],
  [7, 5],
  [10, 2],
  [5, 1],
  [9, 6],
  [4, 2],
  [8, 4],
  [7, 3],
  [10, 5]

];


/* =========================
   START GAME
========================= */

function startGame() {

  currentQuestion = 0;

  score = 0;


  document
    .getElementById("startScreen")
    .classList.add("hidden");


  document
    .getElementById("resultScreen")
    .classList.add("hidden");


  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  document
    .getElementById("score")
    .textContent = score;


  showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

  document
    .getElementById("number")
    .textContent =
      currentQuestion + 1;


  document
    .getElementById("feedback")
    .textContent = "";


  document
    .getElementById("next")
    .style.display = "none";


  const buttons =
    document.querySelectorAll(".answer");


  buttons.forEach(function(btn) {

    btn.disabled = false;

    btn.style.background = "";

  });


  /* GET QUESTION */

  const minuend =
    questions[currentQuestion][0];


  const subtrahend =
    questions[currentQuestion][1];


  /* CALCULATE ANSWER */

  correctAnswer =
    minuend - subtrahend;


  /* DISPLAY QUESTION */

  document
    .getElementById("question")
    .textContent =
      `${minuend} − ${subtrahend} = ?`;


  /* CREATE ANSWERS */

  choices = [correctAnswer];


  while (choices.length < 3) {

    let wrong =
      Math.floor(
        Math.random() * 11
      );


    if (!choices.includes(wrong)) {

      choices.push(wrong);

    }

  }


  /* RANDOMIZE ANSWERS */

  choices.sort(function() {

    return Math.random() - 0.5;

  });


  /* DISPLAY ANSWERS */

  buttons.forEach(function(btn, i) {

    btn.textContent =
      choices[i];

  });

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(index) {

  const buttons =
    document.querySelectorAll(".answer");


  const selected =
    choices[index];


  /* PREVENT MULTIPLE CLICKS */

  buttons.forEach(function(btn) {

    btn.disabled = true;

  });


  /* CORRECT ANSWER */

  if (selected === correctAnswer) {

    score++;


    document
      .getElementById("score")
      .textContent = score;


    document
      .getElementById("feedback")
      .textContent =
        "🎉 Correct! Great job!";


    buttons[index]
      .style.background =
        "#45c486";

  }


  /* WRONG ANSWER */

  else {

    document
      .getElementById("feedback")
      .textContent =
        "😊 Try again!";


    buttons[index]
      .style.background =
        "#ff6b6b";


    /* SHOW CORRECT ANSWER */

    buttons.forEach(function(btn, i) {

      if (
        choices[i] ===
        correctAnswer
      ) {

        btn.style.background =
          "#45c486";

      }

    });

  }


  /* SHOW NEXT BUTTON */

  document
    .getElementById("next")
    .style.display =
      "inline-block";

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

  currentQuestion++;


  if (currentQuestion >= 20) {

    showResult();

  }

  else {

    showQuestion();

  }

}


/* =========================
   RESULT
========================= */

function showResult() {

  document
    .getElementById("gameScreen")
    .classList.add("hidden");


  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .textContent =
      `🎉 Your Score: ${score} / 20`;


  document
    .getElementById("restart")
    .style.display =
      "inline-block";

}


/* =========================
   PLAY AGAIN
========================= */

function restartGame() {

  document
    .getElementById("resultScreen")
    .classList.add("hidden");


  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  startGame();

}

</script>

</body>
</html>
